# Замените домен и пути сертификата собственными значениями.
server {
    listen 80;
    server_name portal.example.org;
    return 301 https://portal.example.org$request_uri;
}
server {
    listen 443 ssl;
    server_name portal.example.org;
    ssl_certificate /etc/letsencrypt/live/portal.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    location /static/ {
        alias /var/www/veqta/static/;
        # Браузер перепроверяет актуальность модулей и CSS после обновления.
        add_header Cache-Control "no-cache";
        access_log off;
    }
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 125s;
        # Параметры кадрового поиска не должны попадать в журнал запросов.
        access_log off;
    }
}
