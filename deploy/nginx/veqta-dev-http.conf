# Только первичный выпуск сертификата; server_apply.sh заменит этот сайт на HTTPS.
server {
    listen 80;
    server_name test.platform.veqta.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/veqta/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 503;
    }
}
