# PROD; прямой доступ к Gunicorn из сети отсутствует.
server {
    listen 80;
    server_name platform.veqta.ru;
    return 301 https://platform.veqta.ru$request_uri;
}
server {
    listen 443 ssl;
    server_name platform.veqta.ru;
    ssl_certificate /etc/letsencrypt/live/platform.veqta.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.veqta.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    access_log off;
    location /static/ {
        alias /var/www/veqta/prod-static/;
        add_header Cache-Control "no-cache";
        access_log off;
    }
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 125s;
    }
}
