# Имя HTTPS-хоста берётся из VEQTA_HOSTNAME выбранного контура.
server {
    listen 80;
    server_name __HOSTNAME__;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/veqta/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://__HOSTNAME__$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name __HOSTNAME__;
    ssl_certificate /etc/letsencrypt/live/__HOSTNAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__HOSTNAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    access_log off;
    location /static/ {
        alias __STATIC_ROOT__/;
        add_header Cache-Control "no-cache";
        access_log off;
    }
    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 125s;
    }
}
