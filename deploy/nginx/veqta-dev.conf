# DEV; сертификат выпускается и обновляется независимо от исходного кода.
server {
    listen 80;
    server_name test.platform.veqta.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/veqta/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://test.platform.veqta.ru$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name test.platform.veqta.ru;
    ssl_certificate /etc/letsencrypt/live/test.platform.veqta.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.platform.veqta.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    access_log off;
    location /static/ {
        alias /var/www/veqta/dev-static/;
        add_header Cache-Control "no-cache";
        access_log off;
    }
    location / {
        proxy_pass http://127.0.0.1:8767;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 125s;
    }
}
