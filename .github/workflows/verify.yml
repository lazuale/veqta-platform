name: Verify VEQTA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COVERAGE_FILE: test-results/coverage/.coverage
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-browser.lock
          python -m pip check
          mkdir -p test-results/coverage
      - name: Install PostgreSQL 19 and HTTPS dependencies
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          sudo tee /etc/apt/sources.list.d/veqta-pgdg.sources >/dev/null <<'APT'
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: noble-pgdg
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          APT
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-19 postgresql-client-19 nginx openssl
          echo /usr/lib/postgresql/19/bin >> "$GITHUB_PATH"
      - name: Source, syntax and protected process environment
        run: |
          python scripts/check_source.py
          python -m compileall -q config portal workwear tests scripts
          for script in scripts/*.sh tests/*.sh; do
            bash -n "$script"
          done
          sudo bash tests/linux_permissions.sh
          sh -n deploy/letsencrypt/renew-nginx.sh
          for script in portal/static/portal/*.js workwear/static/workwear/*.js workwear/static/workwear/js/*.js; do
            node --input-type=module --check < "$script"
          done
          git show --check --format= HEAD
      - name: Install browser engines
        run: |
          python -m playwright install --with-deps chromium firefox webkit
          npm install --prefix "$RUNNER_TEMP/veqta-axe" --no-save --ignore-scripts --no-audit --no-fund axe-core@4.11.0
      - name: Cold Start, role isolation, restore, Django and browser matrix
        run: |
          export VEQTA_TEST_AXE="$RUNNER_TEMP/veqta-axe/node_modules/axe-core/axe.min.js"
          bash tests/postgresql_release.sh --browser
      - name: Publish coverage reports
        if: always()
        run: |
          if [[ -s "$COVERAGE_FILE" ]]; then
            python -m coverage report -m
            python -m coverage json -o test-results/coverage/coverage.json
            python -m coverage html -d test-results/coverage/html
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-branch-coverage
          path: test-results/coverage/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc-browser-evidence
          path: test-results/rc/
          retention-days: 7
          if-no-files-found: ignore
